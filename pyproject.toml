[project]
name = "capstone-agent"
version = "0.1.0"
description = "Backend for an AI agent that accompanies a product through release stages"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "semgrep>=1.100",
    "mcp>=1.2,<2",  # mcp 2.x removed mcp.shared.memory.create_connected_server_and_client_session that the tests use
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "opentelemetry-api~=1.37.0",  # semgrep needs this range; a newer one breaks it
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
demo = ["flask>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
