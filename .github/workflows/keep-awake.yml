# Keeps the free Render copy of Yaqidh awake: Render puts a free service to sleep after 15 minutes without visits,
# and waking it takes about a minute. This opens the site every 5 minutes so the first visitor does not wait.
#
# Setup, once the site is published: GitHub repository > Settings > Secrets and variables > Actions > Variables,
# add a variable named SITE_URL with the site address (for example https://yaqidh.onrender.com).
# While SITE_URL is empty this does nothing. GitHub may delay or skip a scheduled run, so it is a help, not a guarantee.
name: keep-awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open the site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL is not set, nothing to do"; exit 0; fi
          curl -fsS --max-time 120 -o /dev/null -w "status %{http_code} in %{time_total}s\n" "$SITE_URL"
